<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="900"><title>{% block title %}Meta{% endblock %}</title>
<style>
body{font-family:system-ui,sans-serif;width:100%;max-width:none;margin:0;padding:1rem;background:#f5f5f5;color:#222;overflow-y:hidden}
nav{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #ccc;padding-bottom:1rem;margin-bottom:1.5rem}
a{color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
article{background:white;border:1px solid #ddd;border-radius:8px;padding:1rem}
img{max-width:100%;height:auto;border-radius:6px}.muted{color:#666}.error{background:#fee;padding:1rem;border:1px solid #f99}
</style></head><body>
{% block content %}{% endblock %}</body></html>
